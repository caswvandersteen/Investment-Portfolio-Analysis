[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-analysis"
version = "0.1.0"
description = "Data pipeline, performance and risk analysis of a personal equity portfolio"
requires-python = ">=3.12"
dependencies = ["pandas", "numpy", "openpyxl", "pyarrow", "yfinance", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
